services:
  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: 'TRUE'
      ANONYMIZED_TELEMETRY: 'FALSE'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8000/api/v2/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:
